version: "3.7"
name: lms
services:
    mariadb:
        image: mariadb:10.8
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --skip-character-set-client-handshake
            - --skip-innodb-read-only-compressed
        environment:
            MYSQL_ROOT_PASSWORD: 123
        volumes:
            - mariadb-data:/var/lib/mysql

    redis:
        image: redis:alpine

    frappe:
        image: frappe/bench:latest
        command: bash -c "curl -fsSL
            https://raw.githubusercontent.com/Godwin9911/frappe_init/main/init.sh
            | bash"
        environment:
            - SHELL=/bin/bash
        working_dir: /home/frappe
        volumes:
            - frappe-bench:/home/frappe
        ports:
            - 8005:8000
            - 9000:9000
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.frappe.rule=Host(`frappe.stevesbbs.com`)"
            - "traefik.http.routers.frappe.entrypoints=https"
            - "traefik.http.routers.frappe.tls=true"
            - "traefik.http.routers.frappe.tls.certresolver=letsencrypt"
            - "traefik.http.services.frappe.loadbalancer.server.port=8000"

volumes:
    mariadb-data:
    frappe-bench:
